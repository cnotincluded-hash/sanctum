[package]
name = "sanctum"
version = "1.1.1"
description = "Sanctum: your arcane study"
authors = ["Caffeine Not Included"]
edition = "2021"

[lib]
name = "sanctum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
