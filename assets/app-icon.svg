<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2050"/>
      <stop offset="1" stop-color="#110d22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.44" cy="0.6" r="0.55">
      <stop offset="0" stop-color="#f2b552" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f2b552" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdc8f"/>
      <stop offset="1" stop-color="#d48f2a"/>
    </linearGradient>
    <clipPath id="bulb"><circle cx="440" cy="590" r="150"/></clipPath>
  </defs>

  <!-- tile, same footprint as Studio OS so the two sit together on a desktop -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#glow)"/>
  <rect x="116" y="116" width="792" height="792" rx="170" fill="none" stroke="#f2b552" stroke-opacity="0.3" stroke-width="6"/>

  <!-- retort: neck, glass bulb with gold liquid, stand, a falling drop -->
  <path d="M 535 478 C 575 335, 700 300, 806 440" fill="none" stroke="url(#gold)" stroke-width="48" stroke-linecap="round"/>
  <circle cx="440" cy="590" r="150" fill="#1b1534"/>
  <g clip-path="url(#bulb)">
    <path d="M 280 610 Q 360 580 440 610 T 600 605 V 760 H 280 Z" fill="url(#gold)"/>
    <circle cx="390" cy="660" r="14" fill="#fff1c9" opacity="0.8"/>
    <circle cx="470" cy="690" r="9" fill="#fff1c9" opacity="0.7"/>
  </g>
  <circle cx="440" cy="590" r="150" fill="none" stroke="url(#gold)" stroke-width="40"/>
  <path d="M 335 790 H 545 M 375 790 L 352 846 M 505 790 L 528 846" fill="none" stroke="url(#gold)" stroke-width="30" stroke-linecap="round"/>
  <path d="M 812 498 C 798 522, 798 540, 812 548 C 826 540, 826 522, 812 498 Z" fill="#ffdc8f"/>

  <!-- arcane sparkle -->
  <path d="M 300 200 L 320 256 L 376 276 L 320 296 L 300 352 L 280 296 L 224 276 L 280 256 Z" fill="#ffe6ad"/>
  <path d="M 690 214 L 700 242 L 728 252 L 700 262 L 690 290 L 680 262 L 652 252 L 680 242 Z" fill="#ffe6ad" opacity="0.7"/>
</svg>
